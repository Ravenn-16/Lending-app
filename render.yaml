# Free web service only. Provision Aiven MySQL separately.
services:
  - type: web
    name: lending-app
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /up
    autoDeployTrigger: off
    envVars:
      - key: APP_NAME
        value: "Lending System"
      - key: APP_ENV
        value: "production"
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_TIMEZONE
        value: "Asia/Manila"
      - key: TRUST_RENDER_PROXY
        value: "true"
      - key: DB_CONNECTION
        value: "mysql"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: AIVEN_CA_CERT
        sync: false
      - key: MYSQL_ATTR_SSL_CA
        value: "/var/www/html/storage/app/private/aiven-ca.pem"
      - key: SESSION_DRIVER
        value: "database"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_ENCRYPT
        value: "true"
      - key: CACHE_STORE
        value: "database"
      - key: CACHE_PREFIX
        value: "lending_cache_"
      - key: QUEUE_CONNECTION
        value: "sync"
      - key: LOG_CHANNEL
        value: "stderr"
      - key: LOG_LEVEL
        value: "warning"
      - key: LOGIN_CODE_ENABLED
        value: "true"
      - key: OWNER_USERNAME
        sync: false
      - key: OWNER_PASSWORD_HASH
        sync: false
      - key: MAIL_MAILER
        value: "resend"
      - key: RESEND_KEY
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: "Lending System"
