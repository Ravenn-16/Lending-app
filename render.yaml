services:
  - type: pserv
    name: lending-mysql
    runtime: image
    image:
      url: docker.io/library/mysql:8.4
    plan: 1c-2g
    region: singapore
    disk:
      name: lending-mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: lending_system
      - key: MYSQL_USER
        value: lending_app
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true

  - type: web
    name: lending-app
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    healthCheckPath: /up
    autoDeployTrigger: off
    disk:
      name: lending-storage
      mountPath: /var/www/html/storage
      sizeGB: 1
    envVars:
      - key: APP_NAME
        value: Lending System
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: TRUST_RENDER_PROXY
        value: "true"
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromService:
          type: pserv
          name: lending-mysql
          property: host
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        value: lending_system
      - key: DB_USERNAME
        value: lending_app
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: lending-mysql
          envVarKey: MYSQL_PASSWORD
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_ENCRYPT
        value: "true"
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: LOGIN_CODE_ENABLED
        value: "true"
      - key: OWNER_USERNAME
        sync: false
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_SCHEME
        value: smtps
      - key: MAIL_PORT
        value: "465"
      - key: MAIL_HOST
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: Lending System
